<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세컨드브레인 사무실</title>
<meta name="description" content="내 자동화와 Claude 작업을 직원 캐릭터로 보여주는 픽셀 사무실. 팀별 방, 가동·정상·주의·멈춤, 지금 하는 일 말풍선">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0e14; --panel: #111821; --panel-2: #172230; --ink: #e8f1f8; --ink-2: #a9bccb; --muted: #6f8394;
  --rule: rgba(160, 200, 230, .12); --rule-strong: rgba(160, 200, 230, .22);
  --accent: #4fd1ff; --accent-soft: rgba(79, 209, 255, .14);
  --good: #3ddc84; --warn: #ffb84d; --crit: #ff5d6c; --paused: #6f8394;
  --floor: #16202c; --floor-2: #1a2634; --wall: #202e3f; --desk: #3a4a5c; --desk-2: #2c3a49; --screen: #7fe7ff;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
}
/* 라이트 테마: 보드와 같은 저장값(brain-theme)·?theme= 를 따른다 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { color-scheme: light; --bg: #eef1f4; --panel: #fbfbf9; --panel-2: #e6eaee; --ink: #1c1c1a; --ink-2: #4f4f4a; --muted: #6b6b64; --rule: rgba(28, 28, 26, .10); --rule-strong: rgba(28, 28, 26, .18); --accent: #0b7fc2; --accent-soft: rgba(11, 127, 194, .10); --good: #1f7a3a; --warn: #8a6500; --crit: #b8322e; --paused: #8a9199; --floor: #e6eaee; --floor-2: #dfe4ea; --wall: #d3dbe4; --desk: #8a98a8; --desk-2: #6f7d8c; --screen: #0b7fc2; }
}
:root[data-theme="light"] { color-scheme: light; --bg: #eef1f4; --panel: #fbfbf9; --panel-2: #e6eaee; --ink: #1c1c1a; --ink-2: #4f4f4a; --muted: #6b6b64; --rule: rgba(28, 28, 26, .10); --rule-strong: rgba(28, 28, 26, .18); --accent: #0b7fc2; --accent-soft: rgba(11, 127, 194, .10); --good: #1f7a3a; --warn: #8a6500; --crit: #b8322e; --paused: #8a9199; --floor: #e6eaee; --floor-2: #dfe4ea; --wall: #d3dbe4; --desk: #8a98a8; --desk-2: #6f7d8c; --screen: #0b7fc2; }
:root[data-theme="light"] .room.claude, :root:not([data-theme="dark"]) .room.claude { background: linear-gradient(180deg, #d9e6f3 0, #d9e6f3 44px, #edf2f7 44px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); } }
:root[data-theme="dark"] .room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 520px at 80% -10%, var(--accent-soft), transparent 70%), radial-gradient(700px 480px at -10% 100%, rgba(63, 224, 168, .06), transparent 70%); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 80px; }
/* 상단 바 */
.bar { display: flex; align-items: center; gap: 16px; height: 56px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); z-index: 5; }
.bar h1 { font-size: 16px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
.bar .links { display: flex; gap: 4px; }
.bar .links a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); font-size: 14px; }
.bar .links a:hover { color: var(--ink); background: var(--panel-2); }
.bar .stat { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.bar .stat b { color: var(--ink); font-weight: 600; }
.bar .stat .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--paused); }
.lamp.good { background: var(--good); box-shadow: 0 0 8px var(--good); }
.lamp.run { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1.2s ease-in-out infinite; }
.lamp.crit { background: var(--crit); box-shadow: 0 0 8px var(--crit); animation: blink 1.6s ease-in-out infinite; }
.lamp.warn { background: var(--warn); }
@keyframes blink { 50% { opacity: .35; } }
.clock { font-weight: 600; font-variant-numeric: tabular-nums; }
/* 헤드라인(팀장의 한마디) */
.lead { display: flex; gap: 16px; align-items: center; margin: 22px 0 18px; }
.lead .bubble { position: relative; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 12px; padding: 12px 16px; font-size: 15px; max-width: 70ch; word-break: keep-all; }
.lead .bubble::before { content: ""; position: absolute; left: -8px; top: 22px; width: 14px; height: 14px; background: var(--panel); border-left: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); transform: rotate(45deg); }
.lead .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
/* 방(팀) 그리드 */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.room { background: linear-gradient(180deg, var(--wall) 0, var(--wall) 44px, var(--floor) 44px); border: 1px solid var(--rule-strong); border-radius: 14px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 18px 50px rgba(2, 8, 20, .5); position: relative; }
.room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); border-color: color-mix(in srgb, var(--accent) 40%, var(--rule-strong)); }
.room-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; font-size: 14px; }
.room-head h2 { margin: 0; font-size: 14.5px; font-weight: 700; }
.room-head .n { color: var(--muted); font-size: 12.5px; }
.room-head .state { margin-left: auto; font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.window { position: absolute; right: 16px; top: 8px; width: 46px; height: 28px; border-radius: 4px; border: 2px solid #2b3a4e; background: linear-gradient(180deg, var(--sky-1, #2f5b9a), var(--sky-2, #7fb2e6)); opacity: .9; }
.window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #2b3a4e; }
.desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px 4px; padding: 10px 12px 14px; background-image: repeating-linear-gradient(0deg, transparent 0 22px, rgba(255, 255, 255, .025) 22px 23px), repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 255, 255, .025) 22px 23px); }
.desk { position: relative; display: grid; justify-items: center; padding: 22px 4px 8px; border-radius: 8px; background: none; border: 0; text-align: center; min-width: 0; width: 100%; transition: background .15s; }
.desk:hover, .desk:focus-visible { background: rgba(255, 255, 255, .04); }
.desk:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: 0 0 0 2px var(--accent) inset; }
.desk svg { width: 72px; height: 72px; image-rendering: pixelated; shape-rendering: crispEdges; display: block; }
.desk .nm { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desk .st { font-size: 11px; color: var(--muted); }
.desk.fail .nm { color: var(--crit); }
.desk.run .nm { color: var(--accent); }
.desk.paused { opacity: .55; }
.runbtn { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 6px; background: rgba(79, 209, 255, .18); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); font-size: 11px; line-height: 20px; text-align: center; display: none; cursor: pointer; }
.desk:hover .runbtn, .desk:focus-within .runbtn { display: block; }
.runbtn:hover { background: var(--accent); color: var(--bg); }
/* 말풍선 */
.say { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); max-width: 150px; background: #f5f8fb; color: #16212c; border-radius: 8px; padding: 4px 8px; font-size: 11px; line-height: 1.35; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); pointer-events: none; }
.say::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: #f5f8fb; transform: translateX(-50%) rotate(45deg); }
.say.bad { background: #ffe1e4; color: #7a1b23; }
.say.zzz { background: #e2e8f0; color: #526273; font-style: italic; }
.say.think { background: #dff6ff; color: #0b4a63; }
.say.mind { background: rgba(255, 255, 255, .78); color: #3b4653; font-style: italic; border: 1px dashed rgba(90, 110, 130, .45); box-shadow: none; }
.staff-brief { margin: 10px 0; font-size: 13.5px; line-height: 1.55; }
.staff-brief .sb-did { color: var(--ink); }
.staff-brief .sb-issue { color: var(--crit); }
.staff-brief .sb-ok { color: var(--muted); }
.staff-brief .sb-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.staff-brief .text-btn { background: none; border: 1px solid var(--rule, rgba(120,140,160,.4)); border-radius: 6px; padding: 4px 10px; color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
.staff-brief .text-btn.sm { padding: 1px 6px; font-size: 11.5px; }
.say.mind::after { background: rgba(255, 255, 255, .78); }
.desk .st .sc { display: block; color: var(--muted); opacity: .8; }
.desk.talk .say { white-space: normal; max-width: 180px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
@media (max-width: 720px) { .desk.talk .say { max-width: 140px; -webkit-line-clamp: 2; font-size: 10.5px; } .desk { padding-top: 30px; } }
/* 활동 로그 */
.feed { margin-top: 20px; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 14px; padding: 12px 18px 6px; }
.feed h2 { margin: 0 0 6px; font-size: 14.5px; font-weight: 700; }
.feed ul { list-style: none; margin: 0; padding: 0; columns: 2 320px; column-gap: 28px; }
.feed li { font-size: 13px; padding: 5px 0; border-top: 1px solid var(--rule); display: flex; gap: 10px; break-inside: avoid; }
.feed li:first-child { border-top: 0; }
.feed .t { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; width: 46px; }
.feed .k { color: var(--ink); font-weight: 600; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .s { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .s.bad { color: var(--crit); }
/* 상세 */
.detail { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); padding: 14px 16px; display: none; z-index: 6; }
.detail.open { display: block; }
.detail h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.detail .close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; }
.detail pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0; color: var(--ink-2); max-height: 30vh; overflow: auto; }
.detail .meta { font-size: 12.5px; color: var(--muted); }
.hist { margin-top: 10px; }
.hist:empty { display: none; }
.hist-head { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.hist-head b { color: var(--ink); } .hist-head .bad { color: var(--crit); }
.hist svg { display: block; }
.hist-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 14px 16px 18px; }
@media (max-width: 720px) {
  .bar { height: auto; flex-wrap: wrap; padding: 8px 0; }
  .bar .stat { margin-left: 0; }
  .rooms { grid-template-columns: minmax(0, 1fr); }
  .room { min-width: 0; }
  /* 상세 패널: 우측 드로어 대신 하단 바텀시트 */
  .detail { left: 0; right: 0; bottom: 0; top: auto; width: 100%; max-width: none; max-height: 70vh; border-radius: 14px 14px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 420px) {
  body { overflow-x: hidden; }
  .wrap { padding: 0 16px 60px; }
  .bar { gap: 8px; }
  .bar h1 { font-size: 15px; }
  .bar .links { order: 3; width: 100%; }
  .bar .stat { order: 4; flex-basis: 100%; margin-left: 0; justify-content: space-between; gap: 6px; font-size: 11.5px; }
  .desks { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 4px; }
  .desk { min-width: 0; padding-top: 26px; }
  .desk .nm { font-size: 11px; }
  /* 말풍선을 책상 폭에 맞춰 한 줄로 잘라 방 밖으로 넘치지 않게 */
  .say, .desk.talk .say { max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: anywhere; display: block; -webkit-line-clamp: unset; }
  .feed ul { columns: 1; }
  .feed li { flex-wrap: wrap; }
  .feed .k, .feed .s { white-space: normal; overflow: visible; text-overflow: unset; max-width: 100%; overflow-wrap: anywhere; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1><span class="lamp" id="mainLamp"></span>사무실</h1>
    <nav class="links" aria-label="화면 이동"><a href="/">보드</a><a href="/core">코어</a></nav>
    <div class="stat" id="stat"></div>
    <span class="clock" id="clock">--:--</span>
  </header>
  <section class="lead" aria-label="팀장의 한마디">
    <div class="bubble"><div class="who" id="leadWho">브레인</div><div id="leadSay" aria-live="polite">사무실을 여는 중이에요…</div></div>
  </section>
  <main class="rooms" id="rooms" aria-live="polite"></main>
  <section class="feed"><h2>활동 로그</h2><ul id="feed"><li class="empty">불러오는 중</li></ul></section>
</div>
<aside class="detail" id="detail" role="dialog" aria-modal="false" aria-labelledby="dTitle">
  <h3><span id="dTitle"></span><button type="button" class="close" id="dClose" aria-label="닫기">×</button></h3>
  <div class="meta" id="dMeta"></div>
  <div class="hist" id="dHist"></div>
  <div class="staff-brief" id="dBrief"></div>
  <pre id="dBody"></pre>
</aside>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  (function initTheme() { // 보드에서 고른 테마(brain-theme)와 ?theme= 을 따른다
    var saved = null; try { saved = localStorage.getItem("brain-theme"); } catch (e) { /* 저장소 없음 */ }
    var forced = new URLSearchParams(location.search).get("theme");
    var t = (forced === "light" || forced === "dark") ? forced : saved;
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var ST_KO = { ok: "정상", warn: "주의", fail: "실패", stale: "오래됨", missing: "없음", paused: "멈춤", unknown: "알 수 없음", run: "가동 중" };
  /* 가상 직원의 상태 한 줄(MZ 버전)과 속마음. 상태는 진짜 데이터, 말은 재미 */
  var MOOD_LABEL = { run: "일하고 있어요", working: "일하고 있어요", ok: "놀고 있어요 (할 일 다 함)", done: "퇴근했어요", stale: "일하는 척하고 있어요", fail: "멘붕이에요", warn: "눈치 보고 있어요", missing: "출근 안 했어요", paused: "휴가 중이에요", unknown: "첫 출근 준비 중이에요", idle: "대기 중이에요" };
  var JOB_KO = { working: "일하고 있어요", done: "퇴근했어요", blocked: "막혀서 멍 때리는 중", idle: "대기 중이에요", waiting: "대기 중이에요", failed: "멘붕이에요", error: "멘붕이에요" };
  var THOUGHTS = {
    common: ["퇴근하고 싶다...", "배고파,,,", "커피 한 잔만...", "오늘 뭐 먹지", "놀고 싶어..", "회식하고 싶다", "월급은 언제 오르나", "잠깐 눈 붙여도 되나", "카톡 확인만 하고 일할게요", "이거 끝나면 진짜 쉴 거임", "집에 가고 싶다", "주말까지 며칠?", "누가 나 좀 시켜줘", "오늘도 무사히...", "점심 뭐지?"],
    morning: ["아직 잠이 덜 깼어요", "오전엔 원래 느려요", "커피 없이는 못 해요", "출근 도장은 찍었어요"],
    lunch: ["배고파,,, 점심!", "밥 먹고 하죠", "점심 메뉴 추천 좀", "12시인데 왜 아직 여기"],
    afternoon: ["졸려요...", "3시의 마법", "간식 없나요", "퇴근까지 몇 시간"],
    evening: ["퇴근하고 싶다...", "이 시간에 왜 일해요", "야근 수당은요", "집 가고 싸다"],
    night: ["다들 퇴근했는데 나만...", "밤샘 각인가", "새벽 근무 수당"],
    friday: ["금요일인데 회식 안 하나...", "불금이다!!", "주말 계획 세우는 중"],
    monday: ["월요일... 왜 벌써", "주말이 짧았어요", "월요병 걸렸어요"],
    weekend: ["주말에도 출근하는 나...", "오늘 쉬는 날 아니었어요?"],
    run: ["집중!! 말 걸지 마세요", "타자 소리 좋죠?", "이거 금방 끝나요", "열일 중이에요", "지금 제가 다 하고 있어요"],
    ok: ["할 일 다 했는데 뭐 하죠", "폰 봐도 되나", "일하는 척이라도 해야 하나", "다음 근무까지 자유!", "눈치 보며 쉬는 중"],
    stale: ["아무도 안 시켜서 놀아요", "저 아직 여기 있어요...", "언제 불러주실 건가요", "잊혀진 것 같아요"],

    document.querySelectorAll(".desk .say.mind").forEach(function (el) {
      var b = el.parentNode, wid = b.getAttribute("data-wid"), jid = b.getAttribute("data-job");
      var st = (b.className.match(/desk\s+(\S+)/) || [])[1] || "ok";
      el.textContent = wid ? thought(wid, st) : thought("claude-" + jid, st === "run" ? "run" : "ok", "claude");
    });
  }, 20000);
  // 타이핑 프레임: 일하는 직원만 0.5초마다 스프라이트 교체 (동작 줄임 요청 시 생략)
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (!reduceMotion) setInterval(function () {
    S.frame++;
    document.querySelectorAll(".desk.run svg, .desk.working svg").forEach(function (el) {
      var b = el.parentNode, id = b.getAttribute("data-wid") || ("claude-" + b.getAttribute("data-job"));
      var kind = b.getAttribute("data-job") ? "claude" : "";
      var tmp = document.createElement("div"); tmp.innerHTML = sprite(id, kind ? "working" : "run", S.frame, kind);
      el.replaceWith(tmp.firstChild);
    });
  }, 500);
})();
</script>
</body>
</html>
