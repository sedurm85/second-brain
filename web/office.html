<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세컨드브레인 사무실</title>
<meta name="description" content="내 자동화와 Claude 작업을 직원 캐릭터로 보여주는 픽셀 사무실. 팀별 방, 가동·정상·주의·멈춤, 지금 하는 일 말풍선">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0a0e14; --panel: #111821; --panel-2: #172230; --ink: #e8f1f8; --ink-2: #a9bccb; --muted: #6f8394;
  --rule: rgba(160, 200, 230, .12); --rule-strong: rgba(160, 200, 230, .22);
  --accent: #4fd1ff; --accent-soft: rgba(79, 209, 255, .14);
  --good: #3ddc84; --warn: #ffb84d; --crit: #ff5d6c; --paused: #6f8394;
  --floor: #16202c; --floor-2: #1a2634; --wall: #202e3f; --desk: #3a4a5c; --desk-2: #2c3a49; --screen: #7fe7ff;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
}
/* 라이트 테마: 보드와 같은 저장값(brain-theme)·?theme= 를 따른다 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { color-scheme: light; --bg: #eef1f4; --panel: #fbfbf9; --panel-2: #e6eaee; --ink: #1c1c1a; --ink-2: #4f4f4a; --muted: #6b6b64; --rule: rgba(28, 28, 26, .10); --rule-strong: rgba(28, 28, 26, .18); --accent: #0b7fc2; --accent-soft: rgba(11, 127, 194, .10); --good: #1f7a3a; --warn: #8a6500; --crit: #b8322e; --paused: #8a9199; --floor: #e6eaee; --floor-2: #dfe4ea; --wall: #d3dbe4; --desk: #8a98a8; --desk-2: #6f7d8c; --screen: #0b7fc2; }
}
:root[data-theme="light"] { color-scheme: light; --bg: #eef1f4; --panel: #fbfbf9; --panel-2: #e6eaee; --ink: #1c1c1a; --ink-2: #4f4f4a; --muted: #6b6b64; --rule: rgba(28, 28, 26, .10); --rule-strong: rgba(28, 28, 26, .18); --accent: #0b7fc2; --accent-soft: rgba(11, 127, 194, .10); --good: #1f7a3a; --warn: #8a6500; --crit: #b8322e; --paused: #8a9199; --floor: #e6eaee; --floor-2: #dfe4ea; --wall: #d3dbe4; --desk: #8a98a8; --desk-2: #6f7d8c; --screen: #0b7fc2; }
:root[data-theme="light"] .room.claude, :root:not([data-theme="dark"]) .room.claude { background: linear-gradient(180deg, #d9e6f3 0, #d9e6f3 44px, #edf2f7 44px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); } }
:root[data-theme="dark"] .room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(900px 520px at 80% -10%, var(--accent-soft), transparent 70%), radial-gradient(700px 480px at -10% 100%, rgba(63, 224, 168, .06), transparent 70%); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 80px; }
/* 상단 바 */
.bar { display: flex; align-items: center; gap: 16px; height: 56px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); z-index: 5; }
.bar h1 { font-size: 16px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
.bar .links { display: flex; gap: 4px; }
.bar .links a { padding: 6px 10px; border-radius: 6px; color: var(--ink-2); font-size: 14px; }
.bar .links a:hover { color: var(--ink); background: var(--panel-2); }
.bar .stat { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.bar .stat b { color: var(--ink); font-weight: 600; }
.bar .stat .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--paused); }
.kpi-total { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.kpi-total b { color: var(--ink); font-weight: 600; }
.kpi-total .compact { display: none; }
.rate.acc { color: var(--accent); } .rate.warn { color: var(--warn); } .rate.crit { color: var(--crit); }
.lamp.good { background: var(--good); box-shadow: 0 0 8px var(--good); }
.lamp.run { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 1.2s ease-in-out infinite; }
.lamp.crit { background: var(--crit); box-shadow: 0 0 8px var(--crit); animation: blink 1.6s ease-in-out infinite; }
.lamp.warn { background: var(--warn); }
@keyframes blink { 50% { opacity: .35; } }
.clock { font-weight: 600; font-variant-numeric: tabular-nums; }
/* 헤드라인(팀장의 한마디) */
.lead { display: flex; gap: 16px; align-items: center; margin: 22px 0 18px; }
.lead .bubble { position: relative; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 12px; padding: 12px 16px; font-size: 15px; max-width: 70ch; word-break: keep-all; }
.lead .bubble::before { content: ""; position: absolute; left: -8px; top: 22px; width: 14px; height: 14px; background: var(--panel); border-left: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); transform: rotate(45deg); }
.lead .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
/* 오늘 근무표: 24시간 타임라인(크론·launchd 스케줄) */
.shift-strip { margin: 0 0 18px; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 12px; padding: 12px 16px 10px; }
.shift-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.shift-title h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.shift-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; }
.shift-legend span { display: inline-flex; align-items: center; gap: 4px; }
.shift-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.shift-legend .done i { background: var(--accent); } .shift-legend .failed i { background: var(--crit); }
.shift-legend .due i { background: var(--warn); } .shift-legend .upcoming i { background: var(--paused); }
.shift-track { position: relative; height: 40px; margin: 0 4px 6px; border-top: 1px solid var(--rule); }
.shift-tick { position: absolute; top: -7px; transform: translateX(-50%); font-size: 10px; color: var(--muted); white-space: nowrap; }
.shift-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); box-shadow: 0 0 6px var(--accent); transform: translateX(-1px); }
.shift-now::after { content: "지금"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 9.5px; color: var(--accent); white-space: nowrap; }
.shift-dot { position: absolute; top: 16px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 0; padding: 0; background: var(--paused); }
.shift-dot.done { background: var(--accent); } .shift-dot.failed { background: var(--crit); box-shadow: 0 0 6px var(--crit); }
.shift-dot.due { background: var(--warn); } .shift-dot.upcoming { background: var(--paused); opacity: .75; }
.shift-dot::after { content: attr(data-label); position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--rule-strong); color: var(--ink); font-size: 11px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 3; }
.shift-dot:hover::after, .shift-dot:focus-visible::after { opacity: 1; }
.shift-bands { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.shift-band { font-size: 11px; color: var(--ink-2); background: var(--accent-soft); border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shift-band i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.shift-next { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.shift-empty { font-size: 12.5px; color: var(--muted); }
@media (max-width: 720px) { .shift-track { height: 36px; } .shift-dot { top: 14px; } .shift-legend { display: none; } }
/* 방(팀) 그리드 */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.room { background: linear-gradient(180deg, var(--wall) 0, var(--wall) 44px, var(--floor) 44px); border: 1px solid var(--rule-strong); border-radius: 14px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 18px 50px rgba(2, 8, 20, .5); position: relative; }
.room.claude { background: linear-gradient(180deg, #1c2a3e 0, #1c2a3e 44px, #141f2c 44px); border-color: color-mix(in srgb, var(--accent) 40%, var(--rule-strong)); }
.room-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px 10px; font-size: 14px; }
.room-head h2 { margin: 0; font-size: 14.5px; font-weight: 700; }
.room-head .n { color: var(--muted); font-size: 12.5px; }
.room-head .state { margin-left: auto; font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.room-head .usage { font-size: 11.5px; color: var(--muted); width: 100%; }
.kpi { flex-basis: 100%; display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 11px; color: var(--muted); min-width: 0; flex-wrap: wrap; overflow-wrap: anywhere; }
.kpi svg { flex: none; display: block; }
.kpi b { color: var(--ink-2); font-weight: 600; }
.window { position: absolute; right: 16px; top: 8px; width: 46px; height: 28px; border-radius: 4px; border: 2px solid #2b3a4e; background: linear-gradient(180deg, var(--sky-1, #2f5b9a), var(--sky-2, #7fb2e6)); opacity: .9; }
.window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #2b3a4e; }
.desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px 4px; padding: 10px 12px 14px; background-image: repeating-linear-gradient(0deg, transparent 0 22px, rgba(255, 255, 255, .025) 22px 23px), repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 255, 255, .025) 22px 23px); }
.desk { position: relative; display: grid; justify-items: center; padding: 22px 4px 8px; border-radius: 8px; background: none; border: 0; text-align: center; min-width: 0; width: 100%; transition: background .15s; }
.desk:hover, .desk:focus-visible { background: rgba(255, 255, 255, .04); }
.desk:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: 0 0 0 2px var(--accent) inset; }
.desk svg { width: 72px; height: 72px; image-rendering: pixelated; shape-rendering: crispEdges; display: block; }
.desk .nm { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desk .st { font-size: 11px; color: var(--muted); }
.desk.fail .nm { color: var(--crit); }
.desk.run .nm { color: var(--accent); }
.desk.paused { opacity: .55; }
.runbtn { position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 6px; background: rgba(79, 209, 255, .18); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); font-size: 11px; line-height: 20px; text-align: center; display: none; cursor: pointer; }
.desk:hover .runbtn, .desk:focus-within .runbtn { display: block; }
.runbtn:hover { background: var(--accent); color: var(--bg); }
/* 말풍선 */
.say { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); max-width: 150px; background: #f5f8fb; color: #16212c; border-radius: 8px; padding: 4px 8px; font-size: 11px; line-height: 1.35; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); pointer-events: none; }
.say::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; background: #f5f8fb; transform: translateX(-50%) rotate(45deg); }
.say.bad { background: #ffe1e4; color: #7a1b23; }
.say.zzz { background: #e2e8f0; color: #526273; font-style: italic; }
.say.think { background: #dff6ff; color: #0b4a63; }
.say.mind { background: rgba(255, 255, 255, .78); color: #3b4653; font-style: italic; border: 1px dashed rgba(90, 110, 130, .45); box-shadow: none; }
.staff-brief { margin: 10px 0; font-size: 13.5px; line-height: 1.55; }
.staff-brief .sb-did { color: var(--ink); }
.staff-brief .sb-issue { color: var(--crit); }
.staff-brief .sb-ok { color: var(--muted); }
.staff-brief .sb-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.staff-brief .text-btn { background: none; border: 1px solid var(--rule, rgba(120,140,160,.4)); border-radius: 6px; padding: 4px 10px; color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
.staff-brief .text-btn.sm { padding: 1px 6px; font-size: 11.5px; }
.text-btn { background: none; border: 1px solid var(--rule, rgba(120,140,160,.4)); border-radius: 6px; padding: 4px 10px; color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
.text-btn.sm { padding: 1px 6px; font-size: 11.5px; }
.text-btn.danger { border-color: color-mix(in srgb, var(--crit) 55%, transparent); color: var(--crit); }
.say.mind::after { background: rgba(255, 255, 255, .78); }
/* 직원 채용(topbar 버튼 + 모달) */
.hire-btn { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.hire-btn:hover { background: var(--accent); color: var(--bg); }
.hire-btn[hidden] { display: none; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(4, 8, 14, .55); z-index: 8; }
.modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); max-height: min(620px, calc(100vh - 32px)); overflow: auto; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 9; }
.modal h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.modal h3 .close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.modal form { display: flex; flex-direction: column; gap: 10px; }
.modal label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.modal input, .modal select { background: var(--panel-2); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 8px 10px; color: var(--ink); font: inherit; font-size: 13.5px; width: 100%; }
.modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal .err { color: var(--crit); font-size: 12.5px; min-height: 1em; }
.modal .hint { color: var(--muted); font-size: 11.5px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.modal .actions button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--panel-2); color: var(--ink); font-size: 13.5px; cursor: pointer; }
.modal .actions button[type="submit"] { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 600; }
.modal .actions button[type="submit"]:disabled { opacity: .6; cursor: default; }
/* 상세 패널의 부서 이동·퇴사 */
.dHire { margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
.dHire:empty { display: none; }
.hire-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hire-row select { background: var(--panel-2); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 4px 8px; color: var(--ink); font: inherit; font-size: 12.5px; }
.confirm-box { font-size: 12.5px; color: var(--warn); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hire-err { color: var(--crit); font-size: 12px; }
/* 상세 패널의 설정 편집(disclosure, 기본 접힘) */
.dSettings { margin: 10px 0; border-top: 1px solid var(--rule); padding-top: 8px; }
.dSettings[hidden] { display: none; }
.dSettings summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 2px 0; user-select: none; }
.dSettings summary:hover { color: var(--ink); }
.dSettings form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.dSettings label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
.dSettings input, .dSettings select { background: var(--panel-2); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 8px; color: var(--ink); font: inherit; font-size: 12.5px; width: 100%; }
.dSettings .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dSettings .hint { color: var(--muted); font-size: 11px; }
.dSettings .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 2px; }
.dSettings .actions button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--rule-strong); background: var(--panel-2); color: var(--ink); font-size: 12.5px; cursor: pointer; }
.dSettings .actions button[type="submit"] { background: var(--accent); color: var(--bg); border-color: transparent; font-weight: 600; }
.dSettings .actions button[type="submit"]:disabled { opacity: .6; cursor: default; }
.dSettings .err { color: var(--crit); font-size: 12px; min-height: 1em; }
.dSettings .test-result { font-size: 12px; color: var(--ink-2); min-height: 1em; }
.desk .st .sc { display: block; color: var(--muted); opacity: .8; }
.desk.talk .say { white-space: normal; max-width: 180px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
@media (max-width: 720px) { .desk.talk .say { max-width: 140px; -webkit-line-clamp: 2; font-size: 10.5px; } .desk { padding-top: 30px; } }
/* 활동 로그 */
.feed { margin-top: 20px; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 14px; padding: 12px 18px 6px; }
.feed h2 { margin: 0 0 6px; font-size: 14.5px; font-weight: 700; }
.feed ul { list-style: none; margin: 0; padding: 0; columns: 2 320px; column-gap: 28px; }
.feed li { font-size: 13px; padding: 5px 0; border-top: 1px solid var(--rule); display: flex; gap: 10px; break-inside: avoid; }
.feed li:first-child { border-top: 0; }
.feed .t { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; width: 46px; }
.feed .k { color: var(--ink); font-weight: 600; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .s { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .s.bad { color: var(--crit); }
/* 상세 */
.detail { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); padding: 14px 16px; display: none; z-index: 6; }
.detail.open { display: block; }
.detail h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.detail .close { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; }
.detail pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0; color: var(--ink-2); max-height: 30vh; overflow: auto; }
.detail .meta { font-size: 12.5px; color: var(--muted); }
.hist { margin-top: 10px; }
.hist:empty { display: none; }
.hist-head { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
.hist-head b { color: var(--ink); } .hist-head .bad { color: var(--crit); }
.hist svg { display: block; }
.hist-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 14px 16px 18px; }

    <div class="err" id="hireErr" role="alert"></div>

      <button type="button" id="hireCancel">취소</button>
      <button type="submit">채용하기</button>

  </form>
</aside>

    var wid = $("dSettingsWrap").dataset.wid; if (!wid) return;
    var patch = {
      title: $("sTitle").value.trim(), team: $("sTeam").value.trim(), source: $("sSource").value.trim(),
      kind: $("sKind").value, ok_pattern: $("sOk").value.trim(), fail_pattern: $("sFail").value.trim()
    };
    var stale = $("sStale").value.trim(); if (stale !== "") patch.stale_minutes = stale;
    var lines = $("sLines").value.trim(); if (lines !== "") patch.lines = lines;
    var btn = $("dSettingsForm").querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "저장 중…"; $("sErr").textContent = "";
    widgetAction({ action: "update", id: wid, patch: patch }).then(function () {
      return load().then(function () {
        var w = S.widgets[wid];
        if (!w) return;
        var d = w.data || {}, body = d.lines ? d.lines.join("\n") : d.text || (d.fields ? Object.keys(d.fields).map(function (k) { return k + ": " + d.fields[k]; }).join("\n") : "") || w.summary;
        openDetail(w.title, (ST_KO[w.status] || w.status) + " · " + ago(w.age_minutes) + (w.updated_at ? " · " + String(w.updated_at).replace("T", " ").slice(0, 16) : ""), body);
        if (w.kind === "log") fetch("/api/widget-history?id=" + encodeURIComponent(w.id)).then(function (r) { return r.json(); }).then(renderHistory).catch(function () {});
        renderBrief(w.id, null);
        renderHireControls(w);
        fillSettings(w);
        $("leadSay").textContent = shortTitle(w.title) + " 님 설정을 바꿨어요. 다음 근무부터 적용돼요.";
      });
    }).catch(function (err) {
      $("sErr").textContent = err.message || String(err);
    }).then(function () { btn.disabled = false; btn.textContent = "저장"; });
  });

  /* ───────── 직원 채용(모달) ───────── */
  function openHireModal() {
    $("hireErr").textContent = "";
    $("hireForm").reset();
    var dl = $("hTeamList"); dl.innerHTML = "";
    ((S.data && S.data.teams) || []).forEach(function (t) { var o = document.createElement("option"); o.value = t.name; dl.appendChild(o); });
    $("hireModal").hidden = false; $("hireBackdrop").hidden = false;
    $("hTitle").focus();
  }
  function closeHireModal() { $("hireModal").hidden = true; $("hireBackdrop").hidden = true; }
  $("hireBtn").addEventListener("click", openHireModal);
  $("hireClose").addEventListener("click", closeHireModal);
  $("hireCancel").addEventListener("click", closeHireModal);
  $("hireBackdrop").addEventListener("click", closeHireModal);
  $("hireForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var title = $("hTitle").value.trim(), team = $("hTeam").value.trim();
    var body = {
      action: "add", title: title, source: $("hSource").value.trim(), kind: $("hKind").value, team: team,
      ok_pattern: $("hOk").value.trim(), fail_pattern: $("hFail").value.trim(), stale_minutes: $("hStale").value.trim()
    };
    var btn = $("hireForm").querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "채용 중…"; $("hireErr").textContent = "";
    widgetAction(body).then(function () {
      closeHireModal();
      return load().then(function () {
        $("leadSay").textContent = title + " 님이 " + (team || "운영팀") + "에 입사했어요. 첫 근무 기록이 생기면 상태가 잡혀요.";
      });
    }).catch(function (err) {
      $("hireErr").textContent = err.message || String(err);
    }).then(function () { btn.disabled = false; btn.textContent = "채용하기"; });
  });
  /* runbtn(▶)은 role=button span이라 클릭·Enter/Space 모두에서 같은 동작을 태워야 함 */
  function runWidget(rb) {
    var wid = rb.getAttribute("data-run"); rb.textContent = "…";
    fetch("/api/session").then(function (r) { return r.json(); }).then(function (s) {
      return fetch("/api/widget", { method: "POST", headers: { "Content-Type": "application/json", "X-Brain-Token": s.token }, body: JSON.stringify({ action: "run", id: wid }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
    }).then(function () { $("leadSay").textContent = shortTitle((S.widgets[wid] || {}).title) + " 담당에게 지금 일을 시켰어요. 잠시 뒤 타이핑을 시작할 거예요."; setTimeout(load, 5000); })
      .catch(function (err) { rb.textContent = "▶"; $("leadSay").textContent = "실행 실패: " + (err.message || err); });
  }
  document.addEventListener("click", function (ev) {
    var rb = ev.target.closest(".runbtn[data-run]");
    if (rb) { ev.stopPropagation(); ev.preventDefault(); runWidget(rb); return; }
    var b = ev.target.closest(".desk"); if (!b) return;
    if (b.getAttribute("data-wid")) {
      var w = S.widgets[b.getAttribute("data-wid")]; if (!w) return;
      var d = w.data || {}, body = d.lines ? d.lines.join("\n") : d.text || (d.fields ? Object.keys(d.fields).map(function (k) { return k + ": " + d.fields[k]; }).join("\n") : "") || w.summary;
      openDetail(w.title, (ST_KO[w.status] || w.status) + " · " + ago(w.age_minutes) + (w.updated_at ? " · " + String(w.updated_at).replace("T", " ").slice(0, 16) : ""), body);
      if (w.kind === "log") fetch("/api/widget-history?id=" + encodeURIComponent(w.id)).then(function (r) { return r.json(); }).then(renderHistory).catch(function () {});
      renderBrief(w.id, null);
      renderHireControls(w);
      fillSettings(w);
    } else if (b.getAttribute("data-job")) {
      var j = (S.data.jobs || []).filter(function (x) { return x.id === b.getAttribute("data-job"); })[0]; if (!j) return;
      openDetail("Claude 작업 " + j.id, (j.state || "") + (j.tempo ? " · " + j.tempo : "") + (j.updated_min != null ? " · " + ago(j.updated_min) : ""), (j.detail || "") + (j.recent && j.recent.length ? "\n\n최근:\n" + j.recent.join("\n") : ""));
      $("dHire").innerHTML = "";
      var sw = $("dSettingsWrap"); sw.hidden = true; sw.open = false; delete sw.dataset.wid;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") {
      if (!$("hireModal").hidden) { closeHireModal(); return; }
      $("detail").classList.remove("open"); $("dHire").innerHTML = ""; return;
    }
    if (ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar") {
      var rb = ev.target.closest(".runbtn[data-run]");
      if (rb) { ev.preventDefault(); runWidget(rb); }
    }
  });

  /* ───────── 시계·갱신·프레임 ───────── */
  function tick() { var d = new Date(); $("clock").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  tick(); setInterval(tick, 10000);
  function load() { return fetch("/api/office").then(function (r) { return r.json(); }).then(render).catch(function (err) { $("leadSay").textContent = "사무실 데이터를 불러오지 못했어요: " + (err.message || err); }); }
  load(); setInterval(function () { if (!document.hidden) load(); }, 15000);
  fetch("/api/session").then(function (r) { return r.json(); }).then(function (s) { S.token = s.token; S.assistantName = s.assistant_name || "브레인"; }).catch(function () {});
  setInterval(function () {
    document.querySelectorAll(".desk .say.mind").forEach(function (el) {
      var b = el.parentNode, wid = b.getAttribute("data-wid"), jid = b.getAttribute("data-job");
      var st = (b.className.match(/desk\s+(\S+)/) || [])[1] || "ok";
      el.textContent = wid ? thought(wid, st) : thought("claude-" + jid, st === "run" ? "run" : "ok", "claude");
    });
  }, 20000);
  // 타이핑 프레임: 일하는 직원만 0.5초마다 스프라이트 교체 (동작 줄임 요청 시 생략)
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (!reduceMotion) setInterval(function () {
    S.frame++;
    document.querySelectorAll(".desk.run svg, .desk.working svg").forEach(function (el) {
      var b = el.parentNode, id = b.getAttribute("data-wid") || ("claude-" + b.getAttribute("data-job"));
      var kind = b.getAttribute("data-job") ? "claude" : "";
      var tmp = document.createElement("div"); tmp.innerHTML = sprite(id, kind ? "working" : "run", S.frame, kind);
      el.replaceWith(tmp.firstChild);
    });
  }, 500);
})();
</script>
</body>
</html>
