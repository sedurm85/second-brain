<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세컨드브레인 주간 리포트</title>
<meta name="description" content="인쇄용 주간 리포트 한 장. 노트·결정·일지·자동화·할 일을 한 페이지로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #14181c; --ink-2: #4a5560; --muted: #8a939c;
  --rule: #dfe4e8; --rule-strong: #c3cad0; --accent: #0b7fc2; --accent-soft: #eaf4fb;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body { background: var(--bg); color: var(--ink); font: 400 13px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-weight: 600; margin: 0; }
p { margin: 0; }
.page { max-width: 780px; margin: 0 auto; padding: 20px 16px 60px; }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); margin: -20px -16px 20px; }
.toolbar select, .toolbar button, .toolbar a { font: inherit; }
.toolbar button, .toolbar a.btn { border: 1px solid var(--rule-strong); background: #fff; color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; text-decoration: none; }
.toolbar button:hover, .toolbar a.btn:hover { border-color: var(--accent); color: var(--accent); }
.toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar button.primary:hover { opacity: .9; }
.toolbar select { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 6px 8px; background: #fff; color: var(--ink); }
.toolbar .sp { flex: 1; }
.toolbar .gen { font-size: 12px; color: var(--muted); }

header.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
header.head h1 { font-size: 22px; letter-spacing: -.01em; }
header.head .meta { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.5; }
header.head .meta b { color: var(--ink); font-weight: 600; }

.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.strip .cell { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; text-align: center; }
.strip .num { font-size: 24px; font-weight: 700; font-feature-settings: "tnum"; }
.strip .num small { font-size: 12px; font-weight: 400; color: var(--muted); }
.strip .lbl { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

section.sec { margin-bottom: 20px; page-break-inside: avoid; }
section.sec h2 { font-size: 14px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; }
section.sec h2 .n { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 12.5px; padding: 4px 0 2px; }

.bullets { margin: 0; padding: 0; list-style: none; }
.bullets li { padding: 3px 0 3px 14px; position: relative; }
.bullets li::before { content: "―"; position: absolute; left: 0; color: var(--accent); }

.dec-card { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.dec-card .ttl { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.dec-card .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap; }
.dec-card .badge.open { color: var(--accent); border-color: var(--accent); }
.dec-card .row { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.dec-card .row b { color: var(--ink); font-weight: 600; }
.dec-card .revisit { margin-top: 4px; font-size: 11.5px; color: var(--muted); }

.qlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.qlist li { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.qlist .box { display: inline-block; width: 11px; height: 11px; border: 1.4px solid var(--ink-2); border-radius: 2px; flex: none; position: relative; top: 1px; }
.qlist li.done .box { background: var(--ink-2); }
.qlist li.done .box::after { content: ""; position: absolute; left: 2px; top: -1px; width: 4px; height: 7px; border-right: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(40deg); }
.qlist li.done .txt { text-decoration: line-through; color: var(--muted); }

.jrow { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dotted var(--rule); font-size: 12.5px; }
.jrow:last-child { border-bottom: 0; }
.jrow .d { color: var(--muted); flex: none; width: 76px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.nn { padding: 6px 0; border-bottom: 1px dotted var(--rule); font-size: 12.5px; }
.nn .row1 { display: flex; gap: 6px; align-items: baseline; }
.nn .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); flex: none; }
.nn .ttl { font-weight: 600; }
.nn .sm { color: var(--ink-2); margin-top: 2px; }

table.at { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.at th, table.at td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); }
table.at th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
table.at td.num { text-align: right; font-feature-settings: "tnum"; }
table.at .st { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--rule-strong); }
table.at .st.ok { color: #1a7a45; border-color: #1a7a45; }
table.at .st.fail { color: #b5231b; border-color: #b5231b; }
table.at .st.stale, table.at .st.missing, table.at .st.warn, table.at .st.unknown { color: #a16207; border-color: #a16207; }

.opens { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; }
.opens .op b { font-size: 18px; font-weight: 700; display: block; }
.done-row { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

.projrow { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.projrow:last-child { border-bottom: 0; }

footer.pf { margin-top: 24px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 11px; color: var(--muted); text-align: center; }

@page { size: A4; margin: 14mm; }
@media print {
  .toolbar { display: none; }
  .page { max-width: none; margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  section.sec { page-break-inside: avoid; }
}
@media (max-width: 480px) {
  .strip { grid-template-columns: repeat(2, 1fr); }
  .grid2 { grid-template-columns: 1fr; }
  header.head { flex-direction: column; align-items: flex-start; }
  header.head .meta { text-align: left; }
  .toolbar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="toolbar">
  <a class="btn" href="/" title="보드로">보드</a>
  <label for="daysSel" class="sr-only">기간</label>
  <select id="daysSel">
    <option value="7">7일</option>
    <option value="14">14일</option>
    <option value="30">30일</option>
  </select>
  <button type="button" class="primary" id="printBtn">인쇄</button>
  <span class="sp"></span>
  <span class="gen" id="genAt"></span>
</div>
<div class="page" id="page">
  <header class="head">
    <div>
      <h1 id="rangeTitle">주간 리포트</h1>
    </div>
    <div class="meta" id="headMeta"></div>
  </header>

  <div class="strip" id="strip"></div>

  <section class="sec" id="secRetro">
    <h2>이번 주</h2>
    <div id="retroBox"></div>
  </section>

  <section class="sec" id="secDecisions">
    <h2>결정 <span class="n" id="decN"></span></h2>
    <div id="decBox"></div>
  </section>

  <section class="sec" id="secQuestions">
    <h2>되돌아볼 질문 · 다음 주</h2>
    <div id="qnBox"></div>
  </section>

  <section class="sec" id="secJournals">
    <h2>일지 요약 <span class="n" id="jrN"></span></h2>
    <div id="jrBox"></div>
  </section>

  <section class="sec" id="secNew">
    <h2>새 기록 <span class="n" id="nnN"></span></h2>
    <div id="nnBox"></div>
  </section>

  <section class="sec" id="secAuto">
    <h2>자동화 <span class="n" id="atN"></span></h2>
    <div id="atBox"></div>
  </section>

  <section class="sec" id="secTasks">
    <h2>할 일 현황</h2>
    <div id="taskBox"></div>
  </section>

  <footer class="pf" id="footNote"></footer>
</div>

<script>
(function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var days = parseInt(params.get("days"), 10);
  if ([7, 14, 30].indexOf(days) < 0) days = 7;
  $("daysSel").value = String(days);
  $("daysSel").addEventListener("change", function () {
    location.href = "/report?days=" + encodeURIComponent(this.value);
  });
  $("printBtn").addEventListener("click", function () { window.print(); });

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return (d.getMonth() + 1) + "." + d.getDate();
  }

  function renderStrip(r) {
    var c = r.counts || {};
    var a = r.automation || [];
    var runs = a.reduce(function (s, w) { return s + (w.runs || 0); }, 0);
    var fails = a.reduce(function (s, w) { return s + (w.fails || 0); }, 0);
    var cells = [
      ["노트", c.notes || 0, ""],
      ["결정", c.decisions || 0, ""],
      ["일지", c.journals || 0, ""],
      ["자동화 실행/실패", runs, "/" + fails]
    ];
    $("strip").innerHTML = cells.map(function (x) {
      return '<div class="cell"><div class="num">' + x[1] + (x[2] ? '<small>' + esc(x[2]) + '</small>' : "") + '</div><div class="lbl">' + esc(x[0]) + '</div></div>';
    }).join("");
  }

  function renderRetro(r) {
    var rt = r.retro;
    if (!rt || !rt.week || !rt.week.length) {
      $("retroBox").innerHTML = '<p class="empty">회고 없음</p>';
      return;
    }
    var html = '<ul class="bullets">' + rt.week.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>";
    if (rt.patterns && rt.patterns.length) {
      html += '<p class="done-row">눈에 띄는 것: ' + rt.patterns.map(esc).join(" · ") + "</p>";
    }
    $("retroBox").innerHTML = html;
  }

  function renderDecisions(r) {
    var ds = r.decisions || [];
    $("decN").textContent = ds.length ? ds.length + "건" : "";
    if (!ds.length) { $("decBox").innerHTML = '<p class="empty">이번 기간 결정 없음</p>'; return; }
    $("decBox").innerHTML = ds.map(function (d) {
      var badgeCls = d.status === "open" ? "open" : "";
      var statusKo = d.status === "open" ? "열림" : d.status === "decided" ? "확정" : d.status === "superseded" ? "대체됨" : esc(d.status);
      return '<div class="dec-card">' +
        '<div class="ttl"><span>' + esc(d.title) + '</span><span class="badge ' + badgeCls + '">' + statusKo + '</span></div>' +
        (d.decision ? '<div class="row"><b>결정</b> ' + esc(d.decision) + '</div>' : "") +
        (d.why ? '<div class="row"><b>이유</b> ' + esc(d.why) + '</div>' : "") +
        (d.revisit ? '<div class="revisit">되돌아볼 날 ' + esc(d.revisit) + '</div>' : "") +
        '</div>';
    }).join("");
  }

  function renderQuestions(r) {
    var rt = r.retro;
    var qs = (rt && rt.questions) || [];
    var nx = (rt && rt.next_week) || [];
    if (!qs.length && !nx.length) { $("qnBox").innerHTML = '<p class="empty">이번 주 회고에 질문·다음 주 항목 없음</p>'; return; }
    function list(items) {
      return '<ul class="qlist">' + items.map(function (q) {
        return '<li class="' + (q.done ? "done" : "") + '"><span class="box"></span><span class="txt">' + esc(q.text) + '</span></li>';
      }).join("") + '</ul>';
    }
    var html = "";
    if (qs.length) html += '<h3 style="font-size:12.5px;margin-bottom:4px;color:var(--ink-2)">되돌아볼 질문</h3>' + list(qs);
    if (nx.length) html += '<h3 style="font-size:12.5px;margin:8px 0 4px;color:var(--ink-2)">다음 주</h3>' + list(nx);
    $("qnBox").innerHTML = html;
  }

  function renderJournals(r) {
    var js = r.journals || [];
    $("jrN").textContent = js.length ? js.length + "건" : "";
    if (!js.length) { $("jrBox").innerHTML = '<p class="empty">일지 없음</p>'; return; }
    $("jrBox").innerHTML = js.map(function (j) {
      var line = j.summary || (j.lines && j.lines[0]) || "";
      return '<div class="jrow"><span class="d">' + esc(fmtDate(j.date)) + '</span><span>' + esc(line) + '</span></div>';
    }).join("");
  }

  var TYPE_KO = { note: "노트", idea: "아이디어", source: "소스", meeting: "회의", decision: "결정", project: "프로젝트", person: "사람" };

  function renderNew(r) {
    var ns = r.new_notes || [];
    $("nnN").textContent = ns.length ? ns.length + "건" : "";
    if (!ns.length) { $("nnBox").innerHTML = '<p class="empty">새 기록 없음</p>'; return; }
    $("nnBox").innerHTML = '<div class="grid2">' + ns.map(function (n) {
      return '<div class="nn"><div class="row1"><span class="tag">' + esc(TYPE_KO[n.type] || n.type) + '</span><span class="ttl">' + esc(n.title) + '</span></div>' +
        (n.summary ? '<div class="sm">' + esc(n.summary) + '</div>' : "") + '</div>';
    }).join("") + '</div>';
  }

  var ST_KO = { ok: "정상", fail: "실패", stale: "지연", missing: "없음", warn: "주의", unknown: "미확인" };

  function renderAuto(r) {
    var ws = r.automation || [];
    $("atN").textContent = ws.length ? ws.length + "개" : "";
    if (!ws.length) { $("atBox").innerHTML = '<p class="empty">등록된 자동화 없음</p>'; return; }
    $("atBox").innerHTML = '<table class="at"><thead><tr><th>직원</th><th>팀</th><th class="num">' + days + '일 실행</th><th class="num">실패</th><th>상태</th></tr></thead><tbody>' +
      ws.map(function (w) {
        return '<tr><td>' + esc(w.title) + '</td><td>' + esc(w.team || "") + '</td><td class="num">' + (w.runs || 0) + '</td><td class="num">' + (w.fails || 0) + '</td>' +
          '<td><span class="st ' + esc(w.status || "") + '">' + esc(ST_KO[w.status] || w.status || "") + '</span></td></tr>';
      }).join("") + '</tbody></table>';
  }

  function renderTasks(r) {
    var t = r.tasks || {};
    var open = t.open || {};
    var dr = t.done_recent || [];
    var html = '<div class="opens">' +
      ['today', 'week', 'someday', 'waiting'].map(function (k) {
        var ko = { today: "오늘", week: "이번 주", someday: "언젠가", waiting: "기다림" }[k];
        return '<div class="op"><b>' + (open[k] || 0) + '</b>' + ko + '</div>';
      }).join("") + '</div>';
    if (dr.length) html += '<div class="done-row">최근 완료: ' + dr.map(esc).join(" · ") + '</div>';
    $("taskBox").innerHTML = html;
  }

  function render(r) {
    $("rangeTitle").textContent = fmtDate(r.since) + " ~ " + fmtDate(r.until) + " 주간 리포트";
    renderStrip(r);
    renderRetro(r);
    renderDecisions(r);
    renderQuestions(r);
    renderJournals(r);
    renderNew(r);
    renderAuto(r);
    renderTasks(r);
    var now = new Date();
    var genText = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0") + " " +
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    $("genAt").textContent = "생성 " + genText;
    $("footNote").textContent = "세컨드브레인 · " + genText + " 생성";
  }

  fetch("/api/session").then(function (r) { return r.json(); }).then(function (s) {
    var name = s.assistant_name || "브레인";
    $("headMeta").innerHTML = "<div><b>" + esc(name) + "</b></div>";
  }).catch(function () {});

  fetch("/api/report?days=" + days).then(function (r) { return r.json(); }).then(function (r) {
    render(r);
  }).catch(function (err) {
    $("page").insertAdjacentHTML("afterbegin", '<p class="empty">리포트를 불러오지 못했어요. brain.py serve가 켜져 있는지 봐 주세요.</p>');
    console.error(err);
  });
})();
</script>
</body>
</html>
